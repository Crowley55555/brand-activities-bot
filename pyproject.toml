[project]
name = "brand-activities-bot"
version = "0.0.0"
description = "Чат-бот активностей на 5 брендов (headless-ядро)."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "sqlalchemy>=2.0,<3.0",
    "alembic>=1.13,<2.0",
    "psycopg[binary]>=3.2,<4.0",
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.4,<3.0",
    "greenlet>=3.5.6",
    "aiogram>=3.31.0",
    "structlog>=26.1.0",
    "argon2-cffi>=25.1.0",
    "itsdangerous>=2.2.0",
    "python-multipart>=0.0.32",
    "jinja2>=3.1,<4.0",
    "python-magic-bin>=0.4.14 ; sys_platform == 'win32'",
    "python-magic>=0.4.27 ; sys_platform != 'win32'",
    "boto3>=1.35",
    "aioboto3>=13.0",
    "pillow>=10.4",
    "httpx>=0.27,<1.0",
]

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.23,<1.0",
    "freezegun>=1.5,<2.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["alembic/versions", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "app.core.*"
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["."]
