name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv==0.13.0

      - name: System libmagic (python-magic, фаза 3b)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libmagic1

      - name: Install deps
        run: uv sync --frozen

      - name: Ruff
        run: uv run ruff check .

      - name: Mypy (app/core)
        run: uv run mypy app/core

      - name: Pytest
        run: uv run pytest -q
