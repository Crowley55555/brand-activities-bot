{% extends "base.html" %}
{% block content %}
<h1>Вход в админку</h1>
{% if failed %}<p class="error" role="alert">Вход не выполнен: неверный логин или пароль.</p>{% endif %}
<form method="post" action="/admin/login" class="login">
  <input type="hidden" name="_csrf" value="{{ csrf }}">
  <input type="hidden" name="next" value="{{ next_url }}">
  <label>Логин
    <input type="text" name="login" autocomplete="username" maxlength="254" required autofocus>
  </label>
  <label>Пароль
    <input type="password" name="password" autocomplete="current-password" maxlength="1024" required>
  </label>
  <button type="submit">Войти</button>
</form>
{% endblock %}
